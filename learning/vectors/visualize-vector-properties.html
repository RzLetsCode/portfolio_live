<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Vector Properties Mastery</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --accent-blue: #38bdf8;
      --accent-pink: #f43f5e;
      --accent-green: #34d399;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(180deg, rgba(30,41,59,0.5) 0%, rgba(15,23,42,1) 100%);
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-blue);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      gap: 1.5rem;
      padding: 1.5rem;
      flex: 1;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1100px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }

    /* Concept Selector List */
    .concept-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .concept-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .concept-btn:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent-blue);
    }

    .concept-btn.active {
      background: var(--accent-blue);
      color: #000;
      border-color: var(--accent-blue);
      font-weight: 700;
    }

    /* Canvas Viewport */
    .viewport-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      background-color: #090d16;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      cursor: crosshair;
      width: 100%;
      max-width: 600px;
      height: auto;
      aspect-ratio: 1 / 1;
    }

    .canvas-hint {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Control Panel & Math Output */
    .panel-title {
      font-size: 1.1rem;
      color: var(--accent-blue);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .math-display {
      background: #090d16;
      border-radius: 8px;
      padding: 1rem;
      font-family: "Courier New", Courier, monospace;
      margin-bottom: 1rem;
      border-left: 4px solid var(--accent-blue);
      font-size: 0.9rem;
    }

    .control-group {
      margin-bottom: 1rem;
    }

    .control-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--accent-blue);
    }

    .concept-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .concept-description strong {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header>
    <h1>Visualizing Vector Properties</h1>
    <p>An interactive exploration of vectors, linear algebra concepts, and spatial relationships.</p>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="panel-title">Select Concept</h2>
      <div class="concept-list">
        <button class="concept-btn active" onclick="setConcept('magnitude')">1. Magnitude & Direction</button>
        <button class="concept-btn" onclick="setConcept('equality')">2. Displacement & Equality</button>
        <button class="concept-btn" onclick="setConcept('parallel')">3. Parallel Vectors (k · <b>a</b>)</button>
        <button class="concept-btn" onclick="setConcept('orthogonal')">4. Orthogonality (90°)</button>
        <button class="concept-btn" onclick="setConcept('independence')">5. Linear Independence</button>
        <button class="concept-btn" onclick="setConcept('unit')">6. Normalization (<b>â</b>)</button>
      </div>
    </div>

    <div class="viewport-container">
      <canvas id="vectorCanvas" width="600" height="600"></canvas>
      <div class="canvas-hint">Drag arrow heads on the grid to interact with vectors.</div>
    </div>

    <div class="card">
      <h2 class="panel-title">Mathematical Metrics</h2>
      <div id="mathOutput" class="math-display">
        </div>

      <div id="dynamicControls">
        </div>

      <div id="conceptExplanation" class="concept-description">
        </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vectorCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas configuration
    const width = canvas.width;
    const height = canvas.height;
    const origin = { x: width / 2, y: height / 2 };
    const scale = 40; // 40 pixels = 1 grid unit

    // Vector state (in grid units)
    let currentConcept = 'magnitude';
    let vectorA = { x: 3, y: 4 };
    let vectorB = { x: -2, y: 3 };
    let vectorOriginA = { x: 0, y: 0 };
    let vectorOriginB = { x: 2, y: -3 };
    let scalarK = 1.5;

    // Dragging state
    let isDraggingA = false;
    let isDraggingB = false;

    // Convert Grid -> Canvas Pixels
    function toCanvas(pt) {
      return {
        x: origin.x + pt.x * scale,
        y: origin.y - pt.y * scale
      };
    }

    // Convert Canvas Pixels -> Grid
    function toGrid(px, py) {
      return {
        x: Math.round((px - origin.x) / scale * 10) / 10,
        y: Math.round((origin.y - py) / scale * 10) / 10
      };
    }

    // Canvas Event Listeners for Dragging
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (width / rect.width);
      const clickY = (e.clientY - rect.top) * (height / rect.height);

      const targetA = toCanvas({
        x: vectorOriginA.x + vectorA.x,
        y: vectorOriginA.y + vectorA.y
      });
      const targetB = toCanvas({
        x: vectorOriginB.x + vectorB.x,
        y: vectorOriginB.y + vectorB.y
      });

      if (Math.hypot(clickX - targetA.x, clickY - targetA.y) < 20) {
        isDraggingA = true;
      } else if (Math.hypot(clickX - targetB.x, clickY - targetB.y) < 20) {
        isDraggingB = true;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDraggingA && !isDraggingB) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (width / rect.width);
      const clickY = (e.clientY - rect.top) * (height / rect.height);
      const gridPos = toGrid(clickX, clickY);

      if (isDraggingA) {
        vectorA.x = gridPos.x - vectorOriginA.x;
        vectorA.y = gridPos.y - vectorOriginA.y;
      } else if (isDraggingB) {
        vectorB.x = gridPos.x - vectorOriginB.x;
        vectorB.y = gridPos.y - vectorOriginB.y;
      }
      draw();
    });

    window.addEventListener('mouseup', () => {
      isDraggingA = false;
      isDraggingB = false;
    });

    // Drawing Helpers
    function drawGrid() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;

      for (let x = 0; x < width; x += scale) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += scale) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Draw Main Axes
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, origin.y); ctx.lineTo(width, origin.y);
      ctx.moveTo(origin.x, 0); ctx.lineTo(origin.x, height);
      ctx.stroke();
    }

    function drawVector(v, start = {x: 0, y: 0}, color = '#38bdf8', label = 'a') {
      const p1 = toCanvas(start);
      const p2 = toCanvas({ x: start.x + v.x, y: start.y + v.y });

      const headlen = 12;
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);

      // Line
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      // Arrow Head
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y);
      ctx.lineTo(p2.x - headlen * Math.cos(angle - Math.PI / 6), p2.y - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(p2.x - headlen * Math.cos(angle + Math.PI / 6), p2.y - headlen * Math.sin(angle + Math.PI / 6));
      ctx.fill();

      // Label
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(label, p2.x + 10, p2.y - 10);
    }

    function setConcept(concept) {
      currentConcept = concept;
      document.querySelectorAll('.concept-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Reset configurations based on concept
      if (concept === 'equality') {
        vectorA = { x: 3, y: 2 };
        vectorOriginA = { x: -4, y: -2 };
        vectorOriginB = { x: 1, y: 1 };
      } else {
        vectorOriginA = { x: 0, y: 0 };
        vectorOriginB = { x: 0, y: 0 };
      }

      draw();
    }

    function draw() {
      drawGrid();

      const mathDiv = document.getElementById('mathOutput');
      const controlsDiv = document.getElementById('dynamicControls');
      const expDiv = document.getElementById('conceptExplanation');

      controlsDiv.innerHTML = ''; // Clear context controls

      const magA = Math.hypot(vectorA.x, vectorA.y).toFixed(2);

      switch (currentConcept) {
        case 'magnitude':
          drawVector(vectorA, vectorOriginA, '#38bdf8', 'a');
          mathDiv.innerHTML = `
            <strong>Vector a:</strong> (${vectorA.x}, ${vectorA.y})<br>
            <strong>Magnitude ||a||:</strong> √(${vectorA.x}² + ${vectorA.y}²)<br>
            <strong>Length:</strong> ${magA}
          `;
          expDiv.innerHTML = "<strong>Magnitude</strong> is the length of the vector calculated via the Pythagorean theorem. <strong>Direction</strong> is the line along which it points from its tail to its head.";
          break;

        case 'equality':
          vectorB = { ...vectorA }; // Force equality in displacement
          drawVector(vectorA, vectorOriginA, '#38bdf8', 'a');
          drawVector(vectorB, vectorOriginB, '#34d399', 'b (copy)');
          mathDiv.innerHTML = `
            <strong>Vector a:</strong> (${vectorA.x}, ${vectorA.y})<br>
            <strong>Vector b:</strong> (${vectorB.x}, ${vectorB.y})<br>
            <strong>Status:</strong> Equal (a = b)
          `;
          expDiv.innerHTML = "Position does not alter a vector's value! Both vectors represent the exact same displacement, making them equal regardless of where they start in space.";
          break;

        case 'parallel':
          controlsDiv.innerHTML = `
            <div class="control-group">
              <label>Scalar Multiplier (k): <span id="kVal">${scalarK}</span></label>
              <input type="range" min="-3" max="3" step="0.1" value="${scalarK}" oninput="scalarK=parseFloat(this.value); draw();">
            </div>
          `;
          document.getElementById('kVal').innerText = scalarK;
          vectorB = { x: vectorA.x * scalarK, y: vectorA.y * scalarK };
          
          drawVector(vectorB, {x:0, y:0}, '#f43f5e', `b = ${scalarK}a`);
          drawVector(vectorA, {x:0, y:0}, '#38bdf8', 'a');

          mathDiv.innerHTML = `
            <strong>Vector a:</strong> (${vectorA.x}, ${vectorA.y})<br>
            <strong>Scalar k:</strong> ${scalarK}<br>
            <strong>Vector b:</strong> (${vectorB.x.toFixed(1)}, ${vectorB.y.toFixed(1)})
          `;
          expDiv.innerHTML = "Parallel vectors are scalar multiples of each other (<b>a</b> = <i>k</i><b>b</b>). If <i>k</i> > 0, they share direction; if <i>k</i> < 0, they point in exact opposition.";
          break;

        case 'orthogonal':
          // Project B to be 90 degrees from A
          vectorB = { x: -vectorA.y, y: vectorA.x };
          drawVector(vectorA, {x:0, y:0}, '#38bdf8', 'u');
          drawVector(vectorB, {x:0, y:0}, '#a855f7', 'v');

          const dot = (vectorA.x * vectorB.x + vectorA.y * vectorB.y).toFixed(1);

          mathDiv.innerHTML = `
            <strong>Vector u:</strong> (${vectorA.x}, ${vectorA.y})<br>
            <strong>Vector v:</strong> (${vectorB.x}, ${vectorB.y})<br>
            <strong>Dot Product (u · v):</strong> ${dot}<br>
            <strong>Angle:</strong> 90°
          `;
          expDiv.innerHTML = "<strong>Orthogonal</strong> vectors meet at right angles (90°). Moving along vector <b>u</b> yields zero progress along vector <b>v</b>.";
          break;

        case 'independence':
          drawVector(vectorA, {x:0, y:0}, '#38bdf8', 'v1');
          drawVector(vectorB, {x:0, y:0}, '#f43f5e', 'v2');

          const det = (vectorA.x * vectorB.y - vectorA.y * vectorB.x);
          const isInd = Math.abs(det) > 0.1;

          mathDiv.innerHTML = `
            <strong>v1:</strong> (${vectorA.x}, ${vectorA.y})<br>
            <strong>v2:</strong> (${vectorB.x}, ${vectorB.y})<br>
            <strong>Status:</strong> ${isInd ? '<span style="color:var(--accent-green)">Linearly Independent</span>' : '<span style="color:var(--accent-pink)">Linearly Dependent</span>'}
          `;
          expDiv.innerHTML = isInd 
            ? "These vectors are <strong>Linearly Independent</strong>. Neither can be formed by scaling the other, allowing them to span a 2D plane." 
            : "These vectors are <strong>Linearly Dependent</strong>. They fall along the exact same line, offering no new directional information.";
          break;

        case 'unit':
          const unitA = { 
            x: parseFloat(magA) === 0 ? 0 : vectorA.x / magA, 
            y: parseFloat(magA) === 0 ? 0 : vectorA.y / magA 
          };

          drawVector(vectorA, {x:0, y:0}, 'rgba(56, 189, 248, 0.3)', 'a');
          drawVector({x: unitA.x, y: unitA.y}, {x:0, y:0}, '#34d399', 'â');

          mathDiv.innerHTML = `
            <strong>Original a:</strong> (${vectorA.x}, ${vectorA.y})<br>
            <strong>Magnitude ||a||:</strong> ${magA}<br>
            <strong>Unit Vector â:</strong> (${unitA.x.toFixed(2)}, ${unitA.y.toFixed(2)})<br>
            <strong>||â||:</strong> 1.0
          `;
          expDiv.innerHTML = "<strong>Normalization</strong> scales a vector down to a magnitude of exactly 1 (<b>â</b> = <b>a</b> / ||<b>a</b>||). This isolates pure direction without scale.";
          break;
      }
    }

    // Initial render
    draw();
  </script>
</body>
</html>
